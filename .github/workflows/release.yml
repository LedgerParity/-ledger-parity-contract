name: Contract preview release
on:
  push:
    tags: ['v*-preview']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify and package
        run: |
          rustup target add wasm32-unknown-unknown
          cargo fmt --check
          cargo test --locked
          npm ci --prefix tools --ignore-scripts --no-audit --no-fund
          npm test --prefix tools
          cargo build --locked --release --target wasm32-unknown-unknown
          mkdir -p dist
          cp target/wasm32-unknown-unknown/release/ledger_parity_verify.wasm dist/
          cd dist
          sha256sum ledger_parity_verify.wasm > SHA256SUMS
      - name: Publish contract preview
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/ledger_parity_verify.wasm dist/SHA256SUMS --verify-tag --prerelease --title "Report hash contract $GITHUB_REF_NAME" --notes-file TESTNET.md
